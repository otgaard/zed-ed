      // Set host flag before any module imports so project.svelte.ts can

      window.__zedHost__ = 'editor';

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zed-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }

        try {
          var sb = JSON.parse(localStorage.getItem('zed-sidebar') || 'null');
          if (sb && sb.collapsed === true) {
            document.documentElement.dataset.sidebarCollapsed = 'true';
          }
        } catch (_) {}

        try {
          var ly = JSON.parse(localStorage.getItem('zed-layout') || 'null');
          if (ly && ly.bottomPanelOpen === true) {
            document.documentElement.dataset.bottomOpen = 'true';
          }
        } catch (_) {}
      })();
    </script>
